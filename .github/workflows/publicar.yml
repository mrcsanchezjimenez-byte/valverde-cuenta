name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Versión de demostración: sin servidor, con datos ficticios guardados en el navegador.
      # Incluye el panel de gestión en /valverde-cuenta/gestion/ para poder enseñarlo.
      - run: npm run build
        env:
          VITE_DEMO: '1'
          VITE_BASE_GESTION: /valverde-cuenta/gestion/
          VITE_SALIDA_GESTION: ../dist/gestion
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
